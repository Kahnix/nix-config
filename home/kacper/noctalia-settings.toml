[audio]
enable_overdrive = false
enable_sounds = false

[backdrop]
enabled = true

[bar.main]
background_opacity = 0.99999997764825821
capsule = true
capsule_fill = "on_tertiary"
capsule_opacity = 0.35999999195337296
capsule_radius = 8.0
capsule_thickness = 0.78999998606741428
center = [ "clock" ]
end = [ "media", "tray", "notifications", "clipboard", "volume", "control-center", "lock_button" ]
font_scale = 0.94999999999999996
margin_edge = 8
margin_ends = 12
padding = 10
position = "top"
radius = 12
reserve_space = true
shadow = true
start = [ "launcher", "workspaces" ]
thickness = 36
widget_spacing = 8

[calendar]
enabled = true

    [calendar.account.personal_google]
    type = "google"

[control_center]
hidden_tabs = [ "power", "bluetooth" ]

    [[control_center.shortcuts]]
    type = "notification"

    [[control_center.shortcuts]]
    type = "wallpaper"

    [[control_center.shortcuts]]
    type = "screen_recorder"

[dock]
enabled = false

[idle.behavior.lock]
action = "lock"
enabled = true
timeout = 900

[idle.behavior.screen-off]
action = "screen_off"
enabled = true
timeout = 960

[location]
auto_locate = true

[lockscreen]
blur_intensity = 0.55000000000000004
blurred_desktop = true
enabled = true
tint_intensity = 0.32000000000000001
wallpaper = "/home/kacper/Documents/wallpapers/lunar-tides-3440x1440-26444.jpg"

[lockscreen_widgets]
enabled = false
schema_version = 2
widget_order = [ "lockscreen-login-box@HDMI-A-2" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@HDMI-A-2"]
    box_height = 196.0
    box_width = 810.0
    cx = 1720.0
    cy = 1258.0003662109375
    output = "HDMI-A-2"
    placement_height = 1440.0
    placement_width = 3440.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@HDMI-A-2".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

[notification]
enable_daemon = true
layer = "top"
offset_x = 14
offset_y = 8
show_actions = true
show_app_name = true

[osd]
offset_x = 14
offset_y = 8
orientation = "horizontal"
position = "top_right"

[plugins]
enabled = [ "felipeartur/ai-usagebar" ]

[shell]
clipboard_auto_paste = "auto"
clipboard_enabled = true
clipboard_history_max_entries = 250
clipboard_image_action_command = "satty -f -"
clipboard_keep_from_closed_apps = false
corner_radius_scale = 0.84999999999999998
date_format = "%A, %d %B"
niri_overview_type_to_launch_enabled = true
panel_anchor_bar = "main"
polkit_agent = true
settings_show_advanced = true
telemetry_enabled = false
time_format = "{:%H:%M}"

    [shell.animation]
    enabled = true
    speed = 1.1499999999999999

    [shell.launcher]
    app_grid = false
    categories = false
    compact = true
    provider_prefix = "/"
    show_app_origin_indicator = false
    show_icons = false
    sort_by_usage = true

    [shell.panel]
    borders = true
    clipboard_placement = "floating"
    clipboard_position = "center"
    control_center_placement = "attached"
    launcher_placement = "floating"
    launcher_position = "center"
    open_near_click_control_center = true
    session_placement = "attached"
    shadow = true
    transparency_mode = "glass"
    wallpaper_placement = "attached"

    [shell.shadow]
    alpha = 0.47999999999999998
    direction = "down"


    [theme.templates]
    builtin_ids = []
    community_ids = []
    enable_builtin_templates = false
    enable_community_templates = false

[wallpaper]
directory = "/home/kacper/Documents/wallpapers"
edge_smoothness = 0.25
enabled = true
fill_color = "primary"
fill_mode = "crop"
transition = [ "fade", "wipe", "disc" ]
transition_duration = 900
transition_on_startup = true

    [wallpaper.automation]
    enabled = false

    [wallpaper.default]
    path = "/home/kacper/Documents/wallpapers/lunar-tides-3440x1440-26444.jpg"

    [wallpaper.last]
    path = "/home/kacper/Documents/wallpapers/lunar-tides-3440x1440-26444.jpg"

    [wallpaper.monitors.HDMI-A-2]
    path = "/home/kacper/Documents/wallpapers/lunar-tides-3440x1440-26444.jpg"

[widget.clock]
format = "{:%a  %d %b   %H:%M}"

[widget.lock_button]
glyph = "lock"
tooltip = "Lock screen"
type = "custom_button"

    [widget.lock_button.actions]
    left = "exec noctalia msg session lock"

[widget.media]
album_art_only = true
hide_when_no_media = true

[widget.network]
show_label = false
show_vpn_label = false
vpn_status = "replace"

[widget.notifications]
hide_when_no_unread = true
